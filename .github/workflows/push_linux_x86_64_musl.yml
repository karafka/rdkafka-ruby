name: Push Linux x86_64 musl Platform Gem
on:
  push:
    tags:
      - v*
permissions:
  contents: read
env:
  BUNDLE_RETRY: 6
  BUNDLE_JOBS: 4
jobs:
  build:
    if: github.repository_owner == 'karafka'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: deployment
    container:
      # Same as CI, we build on the oldest possible for ABI compatibility
      image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a # renovate: ignore
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache git curl ca-certificates build-base linux-headers \
            pkgconf perl autoconf automake libtool bison flex file bash wget zstd-dev \
            openssl-dev cyrus-sasl-dev cyrus-sasl cyrus-sasl-login \
            cyrus-sasl-crammd5 cyrus-sasl-digestmd5 cyrus-sasl-gssapiv2 cyrus-sasl-scram \
            krb5-libs openssl zlib zlib-dev zstd-libs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Configure git safe directory
        run: git config --global --add safe.directory /__w/karafka-rdkafka/karafka-rdkafka
      - name: Cache build-tmp directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ext/build-tmp-musl
          key: build-tmp-musl-${{ runner.os }}-${{ hashFiles('ext/*.sh', 'ext/Rakefile') }}-v2
      - name: Build precompiled librdkafka.so
        run: |
          cd ext
          bash ./build_linux_x86_64_musl.sh
      - name: Upload precompiled library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: librdkafka-precompiled-musl
          path: ext/
          retention-days: 1

  push:
    if: github.repository_owner == 'karafka'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: build
    environment: deployment
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download precompiled library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: librdkafka-precompiled-musl
          path: ext/

      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: '4.0.10'
          bundler-cache: false

      - name: Build platform-specific gem
        env:
          RUBY_PLATFORM: 'x86_64-linux-musl'
        run: gem build *.gemspec

      # Unlike rubygems/release-gem, this action does not push when signing fails
      - name: Sign and push the gem (with Sigstore attestation)
        uses: karafka/misc/.github/actions/gem-push@0fae3bd661f8f240f5b12039eb844ad52940a4fb # master
