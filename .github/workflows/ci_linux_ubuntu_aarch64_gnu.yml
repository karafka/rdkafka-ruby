# CI Strategy: Comprehensive Testing of Build and Precompiled Flows
#
# This workflow tests both compilation-from-source and precompiled binary distribution
# strategies across multiple Ubuntu and Ruby versions to ensure broad compatibility and
# reliability.
#
# WHY WE TEST UBUNTU 24.04 AND 26.04:
# - Different system library versions (OpenSSL, zlib, libsasl2, libzstd, etc.)
# - Different GCC compiler versions that affect native extension compilation
# - Different glibc versions that can impact binary compatibility
# - Real-world deployment scenarios where users run on various Ubuntu LTS versions
# - Different Ruby versions
#
# COMPILATION FLOW (build_install + specs_install):
# - Tests that librdkafka compiles correctly from source on each Ubuntu version
# - Validates that mini_portile2 can successfully build native dependencies
# - Ensures Ruby native extensions link properly with system libraries
# - Verifies that the same codebase works across different toolchain versions
#
# PRECOMPILED FLOW (build_precompiled + specs_precompiled):
# - Builds the precompiled library in an Ubuntu 22.04 container and fails the build if it needs
#   a glibc symbol newer than GLIBC_2.34 (the RHEL 9 / Amazon Linux 2023 floor)
# - Tests our precompiled static libraries work on different Ubuntu versions
# - Validates that statically-linked binaries are truly portable across environments
# - Ensures precompiled libraries don't have unexpected system dependencies
# - Verifies that removing build tools doesn't break precompiled binary usage
#
# GLIBC FLOOR (glibc_floor):
# - Ubuntu 22.04 runners are retired, so we no longer run specs there
# - Instead, loads the precompiled library with the dynamic loader on ubuntu:22.04,
#   debian:12, rockylinux:9 and amazonlinux:2023 containers
#
# ARTIFACT ISOLATION:
# - Each Ubuntu version gets separate artifacts (rdkafka-built-gem-24.04, etc.)
# - Prevents cross-contamination of OS-specific compiled extensions
# - Ensures test accuracy by matching build and test environments
#
# This comprehensive approach catches issues that single-platform testing would miss,
# such as system library incompatibilities, compiler-specific bugs, or static linking
# problems that only manifest on specific Ubuntu versions.

name: CI Linux Ubuntu aarch64 GNU

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

env:
  BUNDLE_RETRY: 6
  BUNDLE_JOBS: 4

jobs:
  specs_install:
    timeout-minutes: 45
    # JRuby is non-blocking: a failing JRuby job shows red but does not fail the workflow
    continue-on-error: ${{ matrix.continue-on-error || false }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '4.0'
          - '3.4'
          - '3.3'
          - 'jruby-10.0'
        ubuntu-version: ['24.04', '26.04']
        include:
          - ruby: '3.4'
            coverage: 'true'
          - ruby: 'jruby-10.0'
            continue-on-error: true
    runs-on: ubuntu-${{ matrix.ubuntu-version }}-arm
    steps:
      - name: Disable needrestart
        run: sudo apt-get autopurge -y needrestart

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{matrix.ruby}}
          bundler-cache: false
      - name: Start Kafka with Docker Compose
        run: |
          for attempt in 1 2 3 4 5; do
            docker compose -f docker-compose.yml up -d && break
            echo "Attempt $attempt/5 failed."
            docker compose -f docker-compose.yml down -v 2>/dev/null || true
            [ $attempt -lt 5 ] && echo "Retrying in $((attempt * 15))s..." && sleep $((attempt * 15)) || exit 1
          done
          echo "Waiting for Kafka to be ready..."

          sleep 10

          echo "=== Container status ==="
          docker compose ps kafka

          for i in {1..30}; do
            echo "=== Attempt $i/30 ==="

            echo "Testing kafka-topics command..."
            if docker compose exec -T kafka kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              echo "Kafka topics command succeeded!"
              break
            else
              echo "Kafka topics command failed (exit code: $?)"
            fi

            echo "Sleeping 2 seconds..."
            sleep 2
          done
      - name: Install dependencies
        env:
          RDKAFKA_EXT_PATH: ${{ github.workspace }}/ext
        run: |
          # Only install gems that aren't Ruby-version specific
          bundle install
      - name: Build gem with mini_portile
        run: |
          set -e
          cd ext && bundle exec rake
          cd ..
      - name: Run all specs in PLAINTEXT
        env:
          GITHUB_COVERAGE: ${{matrix.coverage}}
          RDKAFKA_EXT_PATH: ${{ github.workspace }}/ext
        run: |
          bundle exec rspec

      - name: Verify Kafka warnings
        run: bin/verify_kafka_warnings

  build_precompiled:
    timeout-minutes: 30
    # We precompile in an Ubuntu 22.04 container, gate on a GLIBC_2.34 floor and check
    # compatibility by running specs since we aim to release only one precompiled version for
    # all supported Linux versions. This is why we do not want Renovate to update the image
    # automatically
    runs-on: ubuntu-26.04-arm
    container:
      image: ubuntu:22.04@sha256:5ec03bb3441e8b0bf3b4f9cd4629a1ae763010dc3035bb8da3ae6cf026486401 # renovate: ignore
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            gcc \
            g++ \
            make \
            tar \
            gzip \
            wget \
            curl \
            file \
            pkg-config \
            autoconf \
            automake \
            libtool \
            python3 \
            git \
            ca-certificates \
            patch \
            libsasl2-dev \
            libssl-dev \
            zlib1g-dev \
            libzstd-dev \
            bison \
            flex \
            perl \
            binutils-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Cache build-tmp directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ext/build-tmp
          key: build-tmp-${{ runner.os }}-${{ hashFiles('ext/*.sh', 'ext/Rakefile') }}-v3
      - name: Build precompiled librdkafka.so
        run: |
          cd ext
          ./build_linux_aarch64_gnu.sh
      - name: Verify glibc floor
        run: |
          # Fails if the library needs a glibc symbol newer than GLIBC_2.34 (RHEL 9, Amazon Linux 2023)
          max=$(objdump -T ext/librdkafka.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          echo "Highest required glibc symbol version: $max"
          if [ "$(printf '%s\n' "$max" GLIBC_2.34 | sort -V | tail -n 1)" != "GLIBC_2.34" ]; then
            echo "librdkafka.so requires $max, above the GLIBC_2.34 floor"
            exit 1
          fi
      - name: Upload precompiled library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: librdkafka-precompiled-linux
          path: ext/
          retention-days: 1

  specs_precompiled:
    timeout-minutes: 30
    needs: build_precompiled
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '4.0'
          - '3.4'
          - '3.3'
        ubuntu-version: ['24.04', '26.04']
        include:
          - ruby: '3.4'
            ubuntu-version: '24.04'
            coverage: 'true'

    runs-on: ubuntu-${{ matrix.ubuntu-version }}-arm
    steps:
      - name: Disable needrestart
        run: sudo apt-get autopurge -y needrestart

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download precompiled library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: librdkafka-precompiled-linux
          path: ext/
      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false
      - name: Start Kafka with Docker Compose
        run: |
          for attempt in 1 2 3 4 5; do
            docker compose -f docker-compose.yml up -d && break
            echo "Attempt $attempt/5 failed."
            docker compose -f docker-compose.yml down -v 2>/dev/null || true
            [ $attempt -lt 5 ] && echo "Retrying in $((attempt * 15))s..." && sleep $((attempt * 15)) || exit 1
          done
          echo "Waiting for Kafka to be ready..."

          sleep 10

          echo "=== Container status ==="
          docker compose ps kafka
          for i in {1..30}; do
            echo "=== Attempt $i/30 ==="

            echo "Testing kafka-topics command..."
            if docker compose exec -T kafka kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              echo "Kafka topics command succeeded!"
              break
            else
              echo "Kafka topics command failed (exit code: $?)"
            fi

            echo "Sleeping 2 seconds..."
            sleep 2
          done
      - name: Install bundle with precompiled library
        env:
          GITHUB_COVERAGE: ${{ matrix.coverage }}
          RDKAFKA_EXT_PATH: ${{ github.workspace }}/ext
        run: |
          bundle install
          echo "Bundle install completed with precompiled library"
      - name: Remove build dependencies to test static linking
        continue-on-error: true
        run: |
          echo "Removing build dependencies to verify precompiled library is truly self-contained..."

          # Remove packages one by one to avoid dependency conflicts
          packages_to_remove="build-essential gcc g++ make patch tar wget libsasl2-dev libssl-dev zlib1g-dev libzstd-dev"

          for package in $packages_to_remove; do
            if dpkg -l | grep -q "^ii.*$package "; then
              echo "Removing $package..."
              sudo dpkg --remove --force-depends $package 2>/dev/null || echo "Could not remove $package"
            else
              echo "$package is not installed"
            fi
          done

          echo "Build dependencies removal completed"
          echo "Remaining build tools:"
          which gcc g++ make 2>/dev/null || echo "No build tools found in PATH (good!)"
      - name: Run specs with precompiled library and PLAINTEXT
        env:
          GITHUB_COVERAGE: ${{ matrix.coverage }}
          RDKAFKA_EXT_PATH: ${{ github.workspace }}/ext
          RDKAFKA_PRECOMPILED: "true"
        run: |
          bundle exec rspec

      - name: Verify Kafka warnings
        run: bin/verify_kafka_warnings

  glibc_floor:
    timeout-minutes: 15
    needs: build_precompiled
    # Loads the precompiled library on the oldest glibc we support (2.34) and on other common
    # glibc distributions. Replaces running the specs on the retired Ubuntu 22.04 runners
    strategy:
      fail-fast: false
      matrix:
        image:
          - 'ubuntu:22.04'
          - 'debian:12'
          - 'rockylinux:9'
          - 'amazonlinux:2023'
    runs-on: ubuntu-26.04-arm
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Download precompiled library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: librdkafka-precompiled-linux
          path: ext/
      - name: Load precompiled library with the dynamic loader
        run: |
          cat /etc/os-release
          # The loader exits 0 even when a symbol version is missing, so check its output
          out=$(/lib/ld-linux-aarch64.so.1 --list ext/librdkafka.so 2>&1)
          echo "$out"
          if echo "$out" | grep -q 'not found'; then
            echo "librdkafka.so cannot be loaded on this glibc"
            exit 1
          fi

  ci-success:
    name: CI Linux Ubuntu aarch64 GNU Success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - specs_install
      - build_precompiled
      - glibc_floor
      - specs_precompiled
    steps:
      - name: Check all jobs passed
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI checks passed!"
