# Linting workflow
#
# This workflow runs linting tools that don't require any external dependencies
# like Kafka. These checks are fast and should block PRs if they fail.
#
# YARD-LINT:
# - Validates YARD documentation syntax and completeness
# - Ensures all public methods have proper parameter and return documentation
# - Catches documentation errors before they reach the codebase

name: Linting

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read

env:
  BUNDLE_RETRY: 6
  BUNDLE_JOBS: 4

jobs:
  rubocop:
    name: RuboCop (StandardRB)
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: Gemfile.lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '4.0.7'
          bundler-cache: true

      - name: Run rubocop
        run: bundle exec rubocop

  yard_lint:
    name: YARD Documentation Lint
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: Gemfile.lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '4.0.7'
          bundler-cache: true

      - name: Run yard-lint
        run: bundle exec yard-lint lib

  lostconf:
    name: Config Files Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lostconf
        run: npx lostconf --fail-on-stale

  ci-success:
    name: Linting Success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - rubocop
      - yard_lint
      - lostconf
    steps:
      - name: Check all jobs passed
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All linting checks passed!"
