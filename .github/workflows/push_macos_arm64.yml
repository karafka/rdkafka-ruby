name: Push macOS ARM64 Platform Gem

on:
  push:
    tags:
      - v*

permissions:
  contents: read

env:
  BUNDLE_RETRY: 6
  BUNDLE_JOBS: 4

jobs:
  push:
    if: github.repository_owner == 'karafka'
    timeout-minutes: 30
    runs-on: macos-26
    environment: deployment
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Bash 4+ and Kerberos
        run: |
          brew install bash
          brew list krb5 &>/dev/null || brew install krb5
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Cache build-tmp directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ext/build-tmp-macos
          key: build-tmp-${{ runner.os }}-${{ hashFiles('ext/*.sh', 'ext/Rakefile') }}-v2

      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: '4.0.10'
          bundler-cache: false

      - name: Build precompiled librdkafka for macOS ARM64
        run: |
          cd ext
          /opt/homebrew/bin/bash ./build_macos_arm64.sh

      - name: Build platform-specific gem
        env:
          RUBY_PLATFORM: 'arm64-darwin'
        run: gem build *.gemspec

      # Unlike rubygems/release-gem, this action does not push when signing fails
      - name: Sign and push the gem (with Sigstore attestation)
        uses: karafka/misc/.github/actions/gem-push@4b22ea7636319e13121e63fbc7ebdf5e15985960 # master
