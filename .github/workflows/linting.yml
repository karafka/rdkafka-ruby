# Linting workflow
#
# This workflow runs linting tools that don't require any external dependencies
# like Kafka. These checks are fast and should block PRs if they fail.
#
# YARD-LINT:
# - Validates YARD documentation syntax and completeness
# - Ensures all public methods have proper parameter and return documentation
# - Catches documentation errors before they reach the codebase

name: Linting

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read

env:
  BUNDLE_RETRY: 6
  BUNDLE_JOBS: 4

jobs:
  # Docs-only pull requests skip the jobs below; the Success job still reports success,
  # so the required check does not stay pending
  changes:
    uses: ./.github/workflows/ci_changes.yml

  rubocop:
    name: RuboCop (StandardRB)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: Gemfile.lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: '4.0.8'
          bundler-cache: true

      - name: Run rubocop
        run: bundle exec rubocop

  yard_lint:
    name: YARD Documentation Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: Gemfile.lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: '4.0.8'
          bundler-cache: true

      - name: Run yard-lint
        run: bundle exec yard-lint lib

  lostconf:
    name: Config Files Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lostconf
        run: npx lostconf --fail-on-stale

  ci-success:
    name: Linting Success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - rubocop
      - yard_lint
      - lostconf
    steps:
      # Skipped jobs are fine only when the change is docs-only
      - name: Check all jobs passed
        if: |
          needs.changes.result != 'success' ||
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          (needs.changes.outputs.code != 'false' && contains(needs.*.result, 'skipped'))
        run: exit 1
      - run: echo "All linting checks passed!"
